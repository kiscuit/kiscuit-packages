<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fc86b9">
<meta name="description" content="Kiscuit Hair Setup Tool — ALCOM / VCC repository launcher">
<title>Kiscuit — Open ALCOM / VCC</title>
<style>
:root{--pink:#fc86b9;--text:#362335;--muted:#796b78;--line:#ecd7e1;--deep:#983965}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 18px;background:#fff7fa;display:flex;align-items:center;justify-content:center;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Apple SD Gothic Neo",sans-serif;color:var(--text)}
main{width:min(100%,510px);background:white;border:1px solid #f1d6e2;border-radius:25px;padding:32px 38px 30px;box-shadow:0 14px 42px #ab718812}
.logo{display:block;width:min(100%,250px);height:auto;margin:0 auto 16px;image-rendering:auto}
.langs{display:flex;justify-content:center;gap:3px;width:max-content;max-width:100%;margin:0 auto 36px;padding:4px;border:1px solid #f2d9e4;border-radius:13px;background:white}
.langs button{cursor:pointer;border:0;background:transparent;border-radius:9px;padding:8px 13px;color:#7a6c77;font-weight:700;font-size:13px}
.langs button[aria-pressed="true"]{background:#ffe5ee;color:#983965}
.langs button:focus-visible,.launch:focus-visible,summary:focus-visible,.copy:focus-visible{outline:3px solid #9d4272;outline-offset:2px}
.launch{display:block;text-align:center;text-decoration:none;background:var(--pink);color:#35172b;font-size:22px;font-weight:850;border-radius:15px;padding:19px 15px;transition:filter .15s}
.launch:hover{filter:brightness(.97)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:19px}
summary{cursor:pointer;color:var(--deep);font-size:14px;font-weight:800;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";font-size:15px}
details[open] summary:before{content:"▾ "}
.fallback{color:var(--muted);font-size:13px;margin:12px 0}
.copyline{display:flex;align-items:center;gap:7px}
.copyline code{flex:1;min-width:0;overflow:auto;white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:11px;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;background:white;color:#65475b}
.copy{cursor:pointer;flex-shrink:0;background:#fff0f6;border:1px solid #edcbdc;border-radius:9px;font-size:13px;font-weight:800;padding:9px 12px;color:#58233e}
@media(max-width:440px){main{padding:25px 19px;border-radius:20px}.langs{margin-bottom:28px}.langs button{padding:8px 10px}.launch{font-size:19px}.copyline{flex-direction:column;align-items:stretch}.copy{width:100%}}
</style>
</head>
<body>
<main>
<img class="logo" src="../assets/kiscuit-logo.png" alt="Kiscuit Hair Setup Tool" width="256" height="122">
<nav class="langs" aria-label="Language">
<button type="button" data-lang="ja" aria-pressed="false">日本語</button>
<button type="button" data-lang="ko" aria-pressed="false">한국어</button>
<button type="button" data-lang="en" aria-pressed="false">ENGLISH</button>
</nav>
<a class="launch" href="vcc://vpm/addRepo?url=https%3A%2F%2Fraw.githubusercontent.com%2Fkiscuit%2Fkiscuit-packages%2Fmain%2Findex.json" id="launch">VCC 열기</a>
<details>
<summary id="fallback-title">앱이 열리지 않나요?</summary>
<p class="fallback" id="fallback-body">VCC에서 Add Repository를 선택한 뒤 아래 주소를 붙여넣으세요.</p>
<div class="copyline">
<code id="repository">https://raw.githubusercontent.com/kiscuit/kiscuit-packages/main/index.json</code>
<button type="button" class="copy" id="copy">주소 복사</button>
</div>
</details>
</main>
<script>
(function(){
const query=new URLSearchParams(location.search);
const app=query.get("app")==="alcom"?"ALCOM":"VCC";
const translations={
ja:{launch:"{app}を開く",fallback:"アプリが開きませんか？",body:"{app}の「Add Repository」で以下のURLを追加してください。",copy:"URLをコピー",copied:"コピーしました！"},
ko:{launch:"{app} 열기",fallback:"앱이 열리지 않나요?",body:"{app}에서 Add Repository를 선택한 뒤 아래 주소를 붙여넣으세요.",copy:"주소 복사",copied:"복사 완료!"},
en:{launch:"Open {app}",fallback:"App not opening?",body:"In {app}, select Add Repository and paste the URL below.",copy:"Copy URL",copied:"Copied!"}
};
const browserLang=(navigator.language||"en").toLowerCase();
let lang=query.has("lang")&&translations[query.get("lang")]?query.get("lang"):(browserLang.startsWith("ja")?"ja":browserLang.startsWith("ko")?"ko":"en");
function render(){
const t=translations[lang], fill=s=>s.replaceAll("{app}",app);
document.documentElement.lang=lang;
document.title="Kiscuit — "+fill(t.launch);
document.getElementById("launch").textContent=fill(t.launch);
document.getElementById("fallback-title").textContent=t.fallback;
document.getElementById("fallback-body").textContent=fill(t.body);
document.getElementById("copy").textContent=t.copy;
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;query.set("lang",lang);history.replaceState(null,"",location.pathname+"?"+query.toString());render()}));
document.getElementById("copy").addEventListener("click",async function(){
try{await navigator.clipboard.writeText(document.getElementById("repository").textContent);this.textContent=translations[lang].copied}
catch(e){prompt(translations[lang].copy,document.getElementById("repository").textContent)}
});
render();
})();
</script>
</body>
</html>
